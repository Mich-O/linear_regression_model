services:
  - type: web
    name: nara-follow-up-api
    runtime: python
    plan: free
    branch: master
    rootDir: summative/API
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn prediction:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: RETRAIN_API_KEY
        generateValue: true
